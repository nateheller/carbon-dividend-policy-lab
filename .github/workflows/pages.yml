name: Deploy Carbon Dividend Policy Lab

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fetch the latest published Bank of Canada daily averages on weekdays.
    - cron: "17 23 * * 1-5"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m unittest -v
      - run: python check_pages.py
      - uses: actions/configure-pages@v5
      - run: python build_pages.py --refresh-rates
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
